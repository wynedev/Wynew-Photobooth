<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wynew Photobooth</title>

    <Style>

        body{
            background-color: rgb(236, 236, 236);
        }

        #mainContainer {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 30px;
            margin-top: 30px;
        }

        #photoGrid {
            width: 200px;
            display: grid;
            grid-template-columns: repeat(1fr, 4);
        
        }

        #camera{
            align-items: center;
            height: 380px;
            width: 500px;
            transform: scaleX(-1);  
            border: solid;
            margin-bottom: 30px;
        }

        #cameraContainer{
            display: flex;
            flex-direction: column;
            justify-self: center;
            align-items: center;
        }

        .cameraBTN{
            width: 130px;
            height: 40px;
            border: none;
            border-radius: 20px;
            background-color: rgb(103, 205, 113);
            color: white;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-weight: bolder;
            transition: background-color 150ms ease-in, transform 150ms ease-in;
            margin-bottom: 10px;
        }

        .cameraBTN:hover {
            background-color: rgba(121, 224, 131, 0.558);
            transform: scale(0.95);
        }

        .photo img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }

    </Style>
</head>
<body>
    <div id="mainContainer">
        <div id="cameraContainer">
            <video src="" id="camera" autoplay></video>
            <button id="showCamera" class="cameraBTN">Show Camera</button>
            <button id="captureBtn" class="cameraBTN">Capture</button>
            <button id="downloadBtn" class="cameraBTN">Download</button>
        </div> 

        <div id="photoGrid"></div>
    </div>  
    <script>
        const camera = document.getElementById('camera');
        const showBtn = document.getElementById('showCamera');
        const photoGrid = document.getElementById('photoGrid');
        var capture = document.getElementById('captureBtn');

        async function showCamera(){
            await navigator.mediaDevices.getUserMedia({video: true})
            .then(stream => {
                camera.srcObject = stream;
            })
            .catch(error => {
                console.error("there is an error accessing the camera");
            });
        }

        capture.addEventListener('click', () => {
            var canvas = document.createElement("canvas");
            var context = canvas.getContext("2d");
            canvas.width = camera.videoWidth;
            canvas.height = camera.videoHeight;


            context.translate(canvas.width, 0);
            context.scale(-1, 1);

            context.drawImage(camera, 0, 0, canvas.width, canvas.height);
            var dataURL = canvas.toDataURL("image/png")

            var photoDiv = document.createElement("div");
            photoDiv.classList.add("photo");

            var img = document.createElement("img");
            img.src = dataURL;
            photoDiv.appendChild(img);
            photoGrid.appendChild(photoDiv);
        });

        showBtn.addEventListener('click', () => showCamera());

        const downloadBtn = document.getElementById('downloadBtn');

        downloadBtn.addEventListener('click', () => {

            const photos = document.querySelectorAll('.photo img');

            if (photos.length === 0) {
                return;
            }

            const width = 400;
            const height = 140;
            const gap = 15;

            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");

            canvas.width = width;
            canvas.height = (height * photos.length) + (gap * (photos.length - 1));

            photos.forEach((img, index) => {

                const y = index * (height + gap);

                context.drawImage(
                    img,
                    0,
                    y,
                    width,
                    height
                );

            });

            const link = document.createElement("a");

            link.download = "captured-photos.png";
            link.href = canvas.toDataURL("image/png");

            link.click();

        });

    </script>
</body>
</html>
