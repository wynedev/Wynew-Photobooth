<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

    <title>Wynew Photobooth</title>

    <style>

        body {
            background-color: rgb(39, 42, 56);
            background-image: radial-gradient(#555b70 1px, transparent 1px);
            font-family: "Space Grotesk", sans-serif;
            background-size: 20px 20px;
        }

        #mainContainer {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 30px;
            margin-top: 30px;
        }

        #camera {
            background-color: #f9f9f9;

            align-items: center;
            height: 532px;
            width: 710px;

            transform: scaleX(-1);

            border: solid;
            border-width: 5px;
            border-color: white;

            margin-bottom: 30px;

            box-shadow: -10px 10px 0 0 #000;
        }

        #cameraContainer {
            display: flex;
            flex-direction: column;
            justify-self: center;
            align-items: center;
        }

        .cameraBTN {
            width: 130px;
            height: 40px;

            border: solid;
            border-width: 3px;
            border-color: white;

            box-shadow: 5px 5px 0 0 #fefefe;

            font-weight: bolder;

            transition:
                background-color 150ms ease-in,
                transform 150ms ease-in;

            margin-bottom: 10px;
        }

        .cameraBTN:hover {
            transform: scale(0.95);
        }

        #btnContainer {
            display: flex;
            flex-direction: row;

            width: 580px;

            justify-content: space-around;
        }

        .photo img {
            margin: 0px;
            padding: 0px;

            width: 200px;
            height: 140px;

            object-fit: cover;
        }

        #photoGrid {
            width: 200px;

            display: grid;
            grid-template-columns: 1fr;

            background-color: #B8A9FA;

            padding: 15px;

            min-height: 170px;

            border: solid;
            border-width: 5px;
            border-color: white;

            margin-bottom: 30px;

            box-shadow: 10px 10px 0 0 #000;
        }

        #title {
            color: white;
            margin-left: 480px;
        }

    </style>
</head>

<body>

    <h1 id="title">Wynew Photobooth</h1>

    <div id="mainContainer">

        <div id="cameraContainer">

            <video
                src=""
                id="camera"
                autoplay>
            </video>

            <div id="btnContainer">

                <button
                    style="background-color: #FF6B6B;"
                    id="showCamera"
                    class="cameraBTN">
                    Show Camera
                </button>

                <button
                    style="background-color: #FFD23F;"
                    id="captureBtn"
                    class="cameraBTN">
                    Capture
                </button>

                <button
                    style="background-color: #74B9FF;"
                    id="downloadBtn"
                    class="cameraBTN">
                    Download
                </button>

                <button
                    style="background-color: #88D498;"
                    id="resetBtn"
                    class="cameraBTN">
                    Reset
                </button>

            </div>

        </div>

        <div id="photoGrid"></div>

    </div>

    <script>

        const camera = document.getElementById('camera');
        const showBtn = document.getElementById('showCamera');
        const photoGrid = document.getElementById('photoGrid');
        const capture = document.getElementById('captureBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');

        async function showCamera() {

            await navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    camera.srcObject = stream;
                })
                .catch(error => {
                    console.error("There is an error accessing the camera.");
                });

        }

        showBtn.addEventListener('click', () => showCamera());

        capture.addEventListener('click', () => {

            if (!camera.srcObject) {
                alert("Please open the camera first.");
                return;
            }

            const videoTrack = camera.srcObject.getVideoTracks()[0];

            if (!videoTrack || videoTrack.readyState !== "live") {
                alert("Please open the camera first.");
                return;
            }

            const currentPhotos =
                document.querySelectorAll('.photo img');

            if (currentPhotos.length >= 4) {
                alert("You can only capture 4 photos.");
                return;
            }

            var canvas = document.createElement("canvas");
            var context = canvas.getContext("2d");

            canvas.width = camera.videoWidth;
            canvas.height = camera.videoHeight;

            context.translate(canvas.width, 0);
            context.scale(-1, 1);

            context.drawImage(
                camera,
                0,
                0,
                canvas.width,
                canvas.height
            );

            var dataURL = canvas.toDataURL("image/png");

            var photoDiv = document.createElement("div");
            photoDiv.classList.add("photo");

            var img = document.createElement("img");
            img.src = dataURL;

            photoDiv.appendChild(img);
            photoGrid.appendChild(photoDiv);

        });

        downloadBtn.addEventListener('click', () => {

            const photos =
                document.querySelectorAll('.photo img');

            if (photos.length === 0) {
                return;
            }

            const photoWidth = 200;
            const photoHeight = 140;

            const padding = 15;
            const gap = 15;
            const border = 5;

            const gridWidth =
                photoWidth +
                (padding * 2) +
                (border * 2);

            const gridHeight =
                (photoHeight * photos.length) +
                (gap * (photos.length - 1)) +
                (padding * 2) +
                (border * 2);

            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");

            canvas.width = gridWidth;
            canvas.height = gridHeight;

            context.fillStyle = "#B8A9FA";

            context.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            context.strokeStyle = "white";
            context.lineWidth = border;

            context.strokeRect(
                border / 2,
                border / 2,
                canvas.width - border,
                canvas.height - border
            );

            photos.forEach((img, index) => {

                const x = padding + border;

                const y =
                    padding +
                    border +
                    index * (photoHeight + gap);

                const imgRatio =
                    img.naturalWidth / img.naturalHeight;

                const boxRatio =
                    photoWidth / photoHeight;

                let drawWidth;
                let drawHeight;
                let drawX;
                let drawY;

                if (imgRatio > boxRatio) {

                    drawWidth = photoWidth;
                    drawHeight =
                        photoWidth / imgRatio;

                    drawX = x;

                    drawY =
                        y +
                        (photoHeight - drawHeight) / 2;

                } else {

                    drawHeight = photoHeight;

                    drawWidth =
                        photoHeight * imgRatio;

                    drawX =
                        x +
                        (photoWidth - drawWidth) / 2;

                    drawY = y;

                }

                context.drawImage(
                    img,
                    drawX,
                    drawY,
                    drawWidth,
                    drawHeight
                );

            });

            const link = document.createElement("a");

            link.download = "captured-photos.png";

            link.href =
                canvas.toDataURL("image/png");

            link.click();

        });

        resetBtn.addEventListener('click', () => {
            photoGrid.innerHTML = "";
        });

    </script>

</body>
</html>
