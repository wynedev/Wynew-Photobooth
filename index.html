<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

    <title>Wynew Photobooth</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: rgb(39, 42, 56);
            background-image: radial-gradient(#555b70 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: "Space Grotesk", sans-serif;

            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            padding: 14px clamp(16px, 5vw, 50px);

            border-bottom: 5px solid white;
            background-color: #FF6B6B;
            box-shadow: 0 10px 0 0 #000;
        }

        #title {
            color: white;
            margin: 0;
            font-size: clamp(1.4rem, 5vw, 2rem);
        }

        #mainContainer {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 30px;

            padding: 40px 16px 30px;
        }

        #cameraContainer {
            display: flex;
            flex-direction: column;
            align-items: center;

            flex: 0 1 710px;
            width: 100%;
            max-width: 710px;
            min-width: 0;
        }

        #cameraFrame {
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;

            background-color: #f9f9f9;
            border: 5px solid white;
            box-shadow: 10px 10px 0 0 #000;

            margin-bottom: 30px;
        }

        #camera {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }


        #btnContainer {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
        }

        .cameraBTN {
            width: 100%;
            min-height: 44px;

            border: 3px solid white;
            box-shadow: 5px 5px 0 0 #fefefe;

            font-family: inherit;
            font-size: 0.95rem;
            font-weight: bolder;
            color: #000;
            cursor: pointer;
            touch-action: manipulation;

            transition: transform 150ms ease-in;
            margin-bottom: 5px;
        }

        .cameraBTN:active {
            transform: scale(0.95);
        }

        @media (hover: hover) {
            .cameraBTN:hover {
                transform: scale(0.95);
            }
        }

        #photoGrid {
            width: 240px;
            max-width: 100%;
            min-height: 170px;

            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            align-content: start;

            background-color: #B8A9FA;
            padding: 15px;

            border: 5px solid white;
            box-shadow: 10px 10px 0 0 #000;

            margin-bottom: 30px;
        }

        .photo img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
        }
        
        @media (max-width: 600px) {
            #mainContainer {
                padding-top: 28px;
                gap: 20px;
            }

            #cameraFrame {
                box-shadow: 6px 6px 0 0 #000;
                margin-bottom: 22px;
            }

            #btnContainer {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .cameraBTN {
                box-shadow: 4px 4px 0 0 #fefefe;
            }

            #photoGrid {
                box-shadow: 6px 6px 0 0 #000;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1 id="title">Wynew Photobooth</h1>
    </header>
    <div id="mainContainer">
        <div id="cameraContainer">
            <div id="cameraFrame">
                <video id="camera" autoplay playsinline muted></video>
            </div>
            <div id="btnContainer">
                <button style="background-color: #FF6B6B;" id="showCamera" class="cameraBTN">
                    Show Camera
                </button>

                <button style="background-color: #FFD23F;" id="captureBtn" class="cameraBTN">
                    Capture
                </button>

                <button style="background-color: #74B9FF;" id="downloadBtn" class="cameraBTN">
                    Download
                </button>

                <button style="background-color: #88D498;" id="resetBtn" class="cameraBTN">
                    Reset
                </button>
            </div>
        </div>
        <div id="photoGrid"></div>

    </div>

    <script>

        const camera = document.getElementById('camera');
        const showBtn = document.getElementById('showCamera');
        const photoGrid = document.getElementById('photoGrid');
        const capture = document.getElementById('captureBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');

        const MAX_PHOTOS = 4;
        const SHOT_W = 800;
        const SHOT_H = 600;

        const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;

        async function showCamera() {

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("Camera is not available. Open this page over HTTPS in a supported browser.");
                return;
            }

            if (camera.srcObject) {
                camera.srcObject.getTracks().forEach(track => track.stop());
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "user",
                        width: { ideal: 1280 },
                        height: { ideal: 960 }
                    }
                });

                camera.srcObject = stream;
                await camera.play().catch(() => {});

            } catch (error) {
                console.error("There is an error accessing the camera.", error);
                alert("Could not access the camera. Please allow camera permission and try again.");
            }

        }

        showBtn.addEventListener('click', showCamera);

        capture.addEventListener('click', () => {

            if (!camera.srcObject) {
                alert("Please open the camera first.");
                return;
            }

            const videoTrack = camera.srcObject.getVideoTracks()[0];

            if (!videoTrack || videoTrack.readyState !== "live" || !camera.videoWidth) {
                alert("Please open the camera first.");
                return;
            }

            if (document.querySelectorAll('.photo img').length >= MAX_PHOTOS) {
                alert("You can only capture 4 photos.");
                return;
            }
            
            const vw = camera.videoWidth;
            const vh = camera.videoHeight;
            const targetRatio = SHOT_W / SHOT_H;

            let sx = 0, sy = 0, sw = vw, sh = vh;

            if (vw / vh > targetRatio) {
                sw = vh * targetRatio;
                sx = (vw - sw) / 2;
            } else {
                sh = vw / targetRatio;
                sy = (vh - sh) / 2;
            }

            const canvas = document.createElement("canvas");
            canvas.width = SHOT_W;
            canvas.height = SHOT_H;

            const context = canvas.getContext("2d");

            context.translate(SHOT_W, 0);
            context.scale(-1, 1);
            context.drawImage(camera, sx, sy, sw, sh, 0, 0, SHOT_W, SHOT_H);

            const photoDiv = document.createElement("div");
            photoDiv.classList.add("photo");

            const img = document.createElement("img");
            img.src = canvas.toDataURL("image/png");

            photoDiv.appendChild(img);
            photoGrid.appendChild(photoDiv);

        });

        downloadBtn.addEventListener('click', async () => {

            const photos = document.querySelectorAll('.photo img');

            if (photos.length === 0) {
                return;
            }

            const S = 3;
            const PW = 200 * S;      
            const PH = 150 * S;      
            const PAD = 15 * S;      
            const GAP = 15 * S;     
            const B = 5 * S;        
            const width = PW + (PAD * 2) + (B * 2);
            const height =
                (PH * photos.length) +
                (GAP * (photos.length - 1)) +
                (PAD * 2) + (B * 2);

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;

            const context = canvas.getContext("2d");

            // Background
            context.fillStyle = "#B8A9FA";
            context.fillRect(0, 0, width, height);

            // White border
            context.strokeStyle = "white";
            context.lineWidth = B;
            context.strokeRect(B / 2, B / 2, width - B, height - B);

            // Photos
            photos.forEach((img, index) => {
                const x = PAD + B;
                const y = PAD + B + index * (PH + GAP);
                context.drawImage(img, x, y, PW, PH);
            });

            const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));

            if (!blob) {
                alert("Could not create the image. Please try again.");
                return;
            }

            const file = new File([blob], "captured-photos.png", { type: "image/png" });

            if (isTouchDevice && navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ files: [file] });
                    return;
                } catch (error) {
                    if (error.name === "AbortError") return;
                }
            }

            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");

            link.download = "captured-photos.png";
            link.href = url;

            document.body.appendChild(link);
            link.click();
            link.remove();

            setTimeout(() => URL.revokeObjectURL(url), 1000);

        });

        resetBtn.addEventListener('click', () => {
            photoGrid.innerHTML = "";
        });

    </script>

</body>
</html>
